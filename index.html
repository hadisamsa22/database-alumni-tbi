<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendataan Alumni Pesantren</title>
    <!-- Tailwind CSS untuk Desain -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-emerald-50 min-h-screen py-10 px-4">

    <div class="max-w-2xl mx-auto">
        <!-- Header -->
        <div class="bg-emerald-700 rounded-t-2xl p-8 text-center text-white shadow-lg">
            <h1 class="text-2xl font-bold mb-2">Formulir Pendataan Alumni</h1>
            <p class="text-emerald-100 text-sm">Pondok Pesantren Tebuireng Jombang</p>
            <p class="text-xs text-emerald-200 mt-3 border-t border-emerald-600 pt-3">
                Silakan lengkapi formulir di bawah ini untuk memperbarui basis data ikatan alumni.
            </p>
        </div>

        <!-- Form Area -->
        <div class="bg-white rounded-b-2xl shadow-xl p-6 md:p-8">
            <form id="alumniForm" onsubmit="kirimData(event)" class="space-y-5">
                
                <!-- Nama Lengkap -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Lengkap Sesuai Ijazah <span class="text-red-500">*</span></label>
                    <input type="text" id="nama" required placeholder="Contoh: Ahmad Abdullah" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <!-- Tahun Lulus -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Tahun Lulus (Angkatan) <span class="text-red-500">*</span></label>
                        <input type="number" id="tahunLulus" required placeholder="Contoh: 2018" min="1980" max="2026" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none transition">
                    </div>

                    <!-- No WhatsApp -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">No. WhatsApp Aktif <span class="text-red-500">*</span></label>
                        <input type="tel" id="noWa" required placeholder="0812xxxxxx" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none transition">
                    </div>
                </div>

                <!-- Pendidikan Terakhir -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Pendidikan Terakhir Saat Ini <span class="text-red-500">*</span></label>
                    <select id="pendidikan" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none transition bg-white">
                        <option value="" disabled selected>-- Pilih Tingkat Pendidikan --</option>
                        <option value="SMA/MA/Sederajat">SMA/MA/Sederajat</option>
                        <option value="D3 / Diploma">D3 / Diploma</option>
                        <option value="S1 / Sarjana">S1 / Sarjana</option>
                        <option value="S2 / Magister">S2 / Magister</option>
                        <option value="S3 / Doktoral">S3 / Doktoral</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>

                <!-- Kesibukan / Profesi -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Kesibukan / Profesi Saat Ini <span class="text-red-500">*</span></label>
                    <input type="text" id="profesi" required placeholder="Contoh: Mahasiswa UIN / Guru / Pengusaha / Karyawan" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none transition">
                </div>

                <!-- Alamat Domisili -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Alamat Domisili Sekarang <span class="text-red-500">*</span></label>
                    <textarea id="alamat" required rows="3" placeholder="Tuliskan alamat lengkap tempat tinggal saat ini..." class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none transition resize-none"></textarea>
                </div>

                <!-- Pesan Berhasil/Gagal -->
                <div id="statusPesan" class="hidden text-sm font-semibold p-3 rounded-lg text-center"></div>

                <!-- Tombol Submit -->
                <div class="pt-4 border-t border-gray-100">
                    <button type="submit" id="btnKirim" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition duration-200">
                        Kirim Data Alumni
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // MASUKKAN URL DARI GOOGLE APPS SCRIPT ANDA DI BAWAH INI
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwMqsxKN0-pY4w5QiGZnc8L0RpwTnk2l5Rw5mAAywcHOb-qR2GrcXB7WByN8xOcznHE/exec';

        function kirimData(event) {
            event.preventDefault(); // Mencegah reload halaman

            if(SCRIPT_URL === 'MASUKKAN_URL_WEB_APP_DISINI') {
                alert("PENTING: Anda belum memasukkan URL Google Apps Script di kode HTML.");
                return;
            }

            const btn = document.getElementById('btnKirim');
            const status = document.getElementById('statusPesan');
            
            // Ubah tombol jadi loading
            btn.innerHTML = 'Merekap Data... ⏳';
            btn.disabled = true;
            btn.classList.replace('bg-emerald-600', 'bg-gray-400');
            status.classList.add('hidden');

            // Ambil data form
            const dataForm = {
                nama: document.getElementById('nama').value,
                tahunLulus: document.getElementById('tahunLulus').value,
                noWa: document.getElementById('noWa').value,
                pendidikan: document.getElementById('pendidikan').value,
                profesi: document.getElementById('profesi').value,
                alamat: document.getElementById('alamat').value
            };

            // Kirim via Fetch ke Google Sheets
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(dataForm)
            })
            .then(response => {
                // Tampilkan sukses
                status.classList.remove('hidden', 'bg-red-100', 'text-red-700');
                status.classList.add('bg-emerald-100', 'text-emerald-700');
                status.innerHTML = '✅ Alhamdulillah, Data berhasil disimpan!';
                
                // Reset Form
                document.getElementById('alumniForm').reset();
            })
            .catch(error => {
                // Tampilkan error
                status.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-700');
                status.classList.add('bg-red-100', 'text-red-700');
                status.innerHTML = '❌ Gagal mengirim data. Pastikan koneksi internet stabil.';
            })
            .finally(() => {
                // Kembalikan tombol seperti semula
                btn.innerHTML = 'Kirim Data Alumni';
                btn.disabled = false;
                btn.classList.replace('bg-gray-400', 'bg-emerald-600');
            });
        }
    </script>
</body>
</html>
